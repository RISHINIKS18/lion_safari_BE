openapi: 3.0.3
info:
  title: Lion Track Safari - CTA & Lead Generation API
  version: 1.0.0
  description: |
    Production-ready Node.js/Express REST API backend for Lion Track Safari lead generation
    and Call to Action (CTA) interaction capturing with PostgreSQL.
  contact:
    name: Lion Track Safari - Arusha Specialist Team
    email: directors@liontracksafari.com
servers:
  - url: /
    description: Current Server

paths:
  /api/safari/enquiry:
    post:
      tags:
        - Safari Enquiries
      summary: CTA 1 - Direct Safari & Route Enquiries (SafariModal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - packageTitle
                - travelerName
                - travelerEmail
                - travelerPhone
              properties:
                packageTitle:
                  type: string
                  example: 7-Day Serengeti & Ngorongoro Classic Migration Safari
                packageId:
                  type: string
                  example: tanzania-classic-7d
                travelerName:
                  type: string
                  example: Dr. Sarah Jenkins
                travelerEmail:
                  type: string
                  format: email
                  example: sarah.jenkins@example.com
                travelerPhone:
                  type: string
                  example: "+1 (555) 234-5678"
                guestCount:
                  type: integer
                  default: 2
                  example: 2
                travelMonth:
                  type: string
                  example: July 2026
                safariStyle:
                  type: string
                  example: Luxury Tented Lodge & Bush Camp
                specialNotes:
                  type: string
                  example: Celebrating our 10th anniversary. Interested in hot air balloon safari.
                currency:
                  type: string
                  default: USD
                  example: USD
                estimatedPrice:
                  type: number
                  example: 4500
                leadSource:
                  type: string
                  default: SafariModal_EnquiryTab
                  example: SafariModal_EnquiryTab
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  referenceCode:
                    type: string
                    example: LTS-2026-9104
                  message:
                    type: string
                    example: Thank you! Your bespoke enquiry has been saved and routed to our Arusha safari directors.
        '400':
          description: Validation error

  /api/custom-safari/quote:
    post:
      tags:
        - Custom Safari Quotes
      summary: CTA 2 - 12-Field Bespoke Safari Builder & Contact Quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - phone
                - destinations
              properties:
                fullName:
                  type: string
                  example: Marcus Vance
                email:
                  type: string
                  format: email
                  example: m.vance@company.com
                phone:
                  type: string
                  example: "+44 7700 900077"
                country:
                  type: string
                  example: United Kingdom
                travelStyle:
                  type: string
                  example: Private Group Safari
                destinations:
                  type: array
                  items:
                    type: string
                  example:
                    - Serengeti National Park
                    - Ngorongoro Crater
                    - Tarangire National Park
                    - Zanzibar Island
                duration:
                  type: string
                  example: 8 - 10 Days
                travelers:
                  type: string
                  example: 4 Adults
                travelDate:
                  type: string
                  example: August 2026
                budgetPreference:
                  type: string
                  example: Luxury Tented Camps ($4,500 - $6,500 / person)
                accommodationType:
                  type: string
                  example: Luxury Tented Safari Lodges
                specialRequests:
                  type: string
                  example: Private photographic guide and interconnected tents.
                howHeard:
                  type: string
                  example: Recommendation / Referral
                subject:
                  type: string
                  example: Private Family Great Migration & Zanzibar Extension
                message:
                  type: string
                  example: We would like to land at Kilimanjaro (JRO) and depart from Zanzibar (ZNZ).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  referenceCode:
                    type: string
                    example: LTS-CUSTOM-8492
                  message:
                    type: string
                    example: Asante sana! Your safari blueprint has been logged for custom itinerary planning.
        '400':
          description: Validation error

  /api/partnerships/apply:
    post:
      tags:
        - B2B Partnerships
      summary: CTA 3 - B2B Travel Agent & DMC Partnership Form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agencyName
                - contactPerson
                - email
                - phone
                - country
                - businessType
              properties:
                agencyName:
                  type: string
                  example: Apex Luxury Travel Ltd
                contactPerson:
                  type: string
                  example: Elena Rostova
                email:
                  type: string
                  format: email
                  example: elena@apextravel.de
                phone:
                  type: string
                  example: "+49 89 1234567"
                country:
                  type: string
                  example: Germany
                businessType:
                  type: string
                  example: Tour Operator
                annualClients:
                  type: string
                  example: 11-50 clients
                message:
                  type: string
                  example: Seeking ground handling partner for East African safari bookings.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Application logged. Automated welcome kit and rate sheet sent to agency email.
        '400':
          description: Validation error

  /api/newsletter/subscribe:
    post:
      tags:
        - Newsletter Opt-In
      summary: CTA 4 - Savannah Journal Newsletter Opt-In
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: wildlife.photographer@nature.org
                source:
                  type: string
                  default: Footer_Savannah_Journal
                  example: Footer_Savannah_Journal
                tags:
                  type: array
                  items:
                    type: string
                  example:
                    - Bush Journal
                    - Great Migration Updates
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Subscribed! You will receive our monthly bush dispatches.
        '400':
          description: Validation error

  /api/leads/quick-contact:
    post:
      tags:
        - Quick Contact Leads
      summary: CTA 5 - Quick Call & WhatsApp Click Logger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
              properties:
                channel:
                  type: string
                  example: WhatsApp_Direct
                phoneNumberDialed:
                  type: string
                  default: "+255682801818"
                  example: "+255682801818"
                pageOrigin:
                  type: string
                  example: /blog?article=tanzania-southern-circuit-vs-northern-circuit
                userLocationHint:
                  type: string
                  example: en-US,en;q=0.9
      responses:
        '201':
          description: Logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Quick contact interaction logged successfully.
        '400':
          description: Validation error

  /api/blog/{id}/feedback:
    post:
      tags:
        - Blog Feedback
      summary: CTA 6 - Blog Article Upvote & Share Feedback
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: tanzania-southern-circuit-vs-northern-circuit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interactionType
              properties:
                interactionType:
                  type: string
                  example: helpful_upvote
      responses:
        '201':
          description: Feedback logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Feedback recorded. Thank you for reading the Savannah Journal.
        '400':
          description: Validation error
